# Mosquitto Broker — Quadra Inteligente de Beach Tennis
# Aceita conexões de qualquer interface (localhost, Wokwi, etc.)

# Porta padrão MQTT (TCP)
listener 1883 0.0.0.0
allow_anonymous true

# Porta WebSocket (opcional, útil para debug com clientes web)
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# Logging verbose (recomendado durante desenvolvimento/apresentação)
log_type all
