[project]
name = "smart-court-backend"
version = "1.0.0"
description = "Backend IoT para a Quadra Inteligente de Beach Tennis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "paho-mqtt>=2.0.0,<3.0.0",
    "influxdb-client[async]>=1.44.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "mqtt", "services", "api"]
